# ---------------------------------------------------------------------------
# HAProxy - modo TCP (Layer 4) para expor o PostgreSQL do Hostfy.
#
# O frontend recebe conexoes TCP puras (protocolo do Postgres) e encaminha
# para o container "db". Nao ha terminacao TLS aqui: o proprio Postgres
# negocia o SSL, entao o trafego chega cifrado no banco.
#
# O Postgres escuta no container; o HAProxy conecta pelo alias do docker.
# ---------------------------------------------------------------------------

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 2
    timeout connect 10s
    timeout client  1h
    timeout server  1h
    timeout queue   30s

# Interface publica do Postgres (TCP puro; o TLS e negociado pelo Postgres).
frontend postgres_tcp
    bind *:5432
    bind [::]:5432
    default_backend postgres_backend

# Container "db" do docker-compose, alcancavel pelo host na porta
# publicada (DB_HOST_PORT -> 127.0.0.1:55432).
backend postgres_backend
    server postgres 127.0.0.1:55432 check inter 5s rise 2 fall 3