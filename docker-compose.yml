services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 1591
      DATABASE_URL: postgres://${POSTGRES_USER:-hostly}:${POSTGRES_PASSWORD:-change-me-now}@db:5432/${POSTGRES_DB:-hostly}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:1591}
      PROJECTS_ORIGIN: ${PROJECTS_ORIGIN:-http://localhost:1592}
      PROJECTS_DOMAIN: ${PROJECTS_DOMAIN:-}
      PROJECTS_SCHEME: ${PROJECTS_SCHEME:-https}
      RUNNER_URL: http://runner:1594
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-me-runner-token}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      STORAGE_DIR: /data/projects
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-change-me-encryption-secret}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Banco de dados por projeto (mesma instância do Postgres do serviço "db")
      PROJECT_DB_HOST: ${PROJECT_DB_HOST:-db}
      PROJECT_DB_PORT: ${PROJECT_DB_PORT:-5432}
      PROJECT_DB_ALERT_MB: ${PROJECT_DB_ALERT_MB:-200}
    ports:
      - "${APP_PORT:-1591}:1591"
    volumes:
      - projects:/data/projects
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    networks: [internal]

  # Executa projetos PHP/Node, gerencia stacks Docker Compose e faz o proxy
  # por subdomínio ({slug}.PROJECTS_DOMAIN). Também cuida da limpeza do Docker.
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    # O runner fala com o socket do Docker para subir os projetos Compose e
    # executar a manutenção. Isso equivale a acesso root no host — veja o README.
    user: "0:0"
    environment:
      NODE_ENV: production
      RUNNER_PORT: 1593
      RUNNER_CONTROL_PORT: 1594
      RUNNER_TOKEN: ${RUNNER_TOKEN:-change-me-runner-token}
      DATABASE_URL: postgres://${POSTGRES_USER:-hostly}:${POSTGRES_PASSWORD:-change-me-now}@db:5432/${POSTGRES_DB:-hostly}
      STORAGE_DIR: /data/projects
      PROJECTS_DOMAIN: ${PROJECTS_DOMAIN:-}
      # Subdomínios de sites estáticos são repassados a este serviço.
      STATIC_URL: http://static:1592
      PORT_BASE: ${PORT_BASE:-21000}
      RUNNER_NODE_MEM_MB: ${RUNNER_NODE_MEM_MB:-256}
      RUNNER_PHP_MEMORY: ${RUNNER_PHP_MEMORY:-256M}
      CLEANUP_ENABLED: ${CLEANUP_ENABLED:-true}
      CLEANUP_GRACE_HOURS: ${CLEANUP_GRACE_HOURS:-24}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
      DOCKER_TIMEOUT_MS: ${DOCKER_TIMEOUT_MS:-1200000}
      # Rede usada para publicar o Postgres para os contêineres dos projetos
      DATABASES_NETWORK: ${DATABASES_NETWORK:-hostfy_databases}
    ports:
      # O cloudflared (no host ou em outro container) aponta para esta porta.
      - "${RUNNER_PORT:-1593}:1593"
    volumes:
      - projects:/data/projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      static:
        condition: service_started
    networks: [internal]

  static:
    build: .
    command: ["node", "src/static-server.js"]
    restart: unless-stopped
    environment:
      STATIC_PORT: 1592
      DATABASE_URL: postgres://${POSTGRES_USER:-hostly}:${POSTGRES_PASSWORD:-change-me-now}@db:5432/${POSTGRES_DB:-hostly}
      STORAGE_DIR: /data/projects
    ports:
      - "${STATIC_PORT:-1592}:1592"
    volumes:
      - projects:/data/projects:ro
    networks: [internal]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hostly}
      POSTGRES_USER: ${POSTGRES_USER:-hostly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hostly} -d ${POSTGRES_DB:-hostly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # "databases" é a rede usada pelos projetos para falar com este Postgres.
    networks: [internal, databases]

volumes:
  postgres_data:
  projects:

networks:
  internal:
  # Rede isolada: só o Postgres e os contêineres dos projetos ficam aqui.
  # Assim o projeto alcança "db:5432" sem enxergar o painel nem o runner.
  databases:
    name: hostfy_databases
    internal: true